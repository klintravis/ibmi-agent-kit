schema: spec-driven

context: |
  Public repo. Never put a real enterprise's library names, partitions, vendor command names,
  hostnames or credentials in it; examples use PUB400 or invented names. A company's real
  policy lives in that company's private repo and is loaded by path.
  packages/screen and packages/source began as SH4RKKK's Apache-2.0 servers and are now a hard
  fork owned by this kit: restructure freely, but keep the original LICENSE/NOTICE text and
  add a modification line to each file changed from upstream.
  Each user signs on with their own IBM i credentials. IBM i object authority is the real
  boundary; the kit's guard catches mistakes, it does not stop a determined user.
  Knowledge of a company's system belongs in Claude skills, not in this MCP.
  Must run without Docker on Windows, macOS and Linux with Node >= 20.
  Tests follow the engines' style: one src/selfcheck.ts per package run by `node --test` via
  `npm run check`, no test framework dependency, stubs instead of a live IBM i.

rules:
  proposal:
    - State what is out of scope
    - Name the MCP tools added or changed, with their read-only or destructive annotation
  design:
    - Prefer fewer, well-described MCP tools with structured output over many narrow ones

