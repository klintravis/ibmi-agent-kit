schema: spec-driven

context: |
  Public repo. Never put a real enterprise's schema, workflows, hostnames or credentials in it;
  examples target PUB400 or invented data. Real packs live in private repos.
  packages/screen and packages/source are imported Apache-2.0 code (git subtree from SH4RKKK);
  keep their LICENSE and NOTICE, keep changes small so upstream fixes can still be pulled.
  Must run without Docker on Windows, macOS and Linux with Node >= 18.
  The IBM i user profile is the real safety boundary; the kit's guards are a second layer only.

rules:
  proposal:
    - State what is out of scope
    - Name the MCP tools added or changed, with their read-only or destructive annotation
  design:
    - Prefer fewer, well-described MCP tools with structured output over many narrow ones

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
