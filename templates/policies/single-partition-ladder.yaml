# Template: one IBM i partition, a library ladder (dev -> test -> live).
# Copy to your company repo as policy.yaml and replace every invented name (groups, prefixes).
# Observe mode: denies are logged and the statement still runs, except danger, unqualified changes and
# partition conflicts, which are always denied. Tighten to `enforce` only after
# `ibmi-agent-kit policy replay` over the run log shows the denies you expect.
version: 1
mode: observe

environments:                  # one list, first match wins
  - { name: scratch,  libraries: [QTEMP] }
  - { name: personal, match: ["${USER}", "${USER}_*"] }   # the user's own library
  - { name: system,   match: ["Q*", "SYS*"] }
  - { name: dev,      match: ["DV*"] }                    # replace with your development prefix
  - { name: test,     match: ["TS*"] }                    # replace with your test prefix
  - { name: live,     match: ["LV*"] }                    # replace with your production prefix

roles:                         # a user holds every role that matches
  - { name: qa,  groups: [GRPQA] }
  - { name: dev, groups: [GRPDEV] }
  - { name: analyst, groups: [GRPANL] }
default_role: analyst          # anyone not in another role: reads only

rules:                         # first match wins; unmatched = deny
  - { classes: [danger], decision: deny }   # documents the built-in; never reached
  - { env: scratch, classes: [read, write, ddl], decision: allow }
  - { roles: [dev, qa], env: [personal, dev], decision: allow }
  - { roles: [qa], env: test, decision: allow }
  - { classes: [read], decision: allow }
