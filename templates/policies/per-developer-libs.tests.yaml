# Policy tests for per-developer-libs.yaml: every role in every environment, a read and a write, plus an
# unclassified command (denied as danger) wherever the write is allowed.
# Run: ibmi-agent-kit policy test per-developer-libs.yaml per-developer-libs.tests.yaml
# `expect` is the policy's decision per statement; in observe mode a deny is logged and still run.
# Users: JDOE (dev), KLEE (lead), ANL01 (analyst). A personal library is the user's own name.
- name: dev scratch
  as: { user: JDOE, groups: [GRPDEV] }
  script: |
    SELECT * FROM QTEMP.T;
    DELETE FROM QTEMP.T;
    CL: ZZZUNKNOWN LIB(QTEMP)
  expect: [allow, allow, deny]
- name: dev personal
  as: { user: JDOE, groups: [GRPDEV] }
  script: |
    SELECT * FROM JDOE.T;
    DELETE FROM JDOE.T;
    CL: ZZZUNKNOWN LIB(JDOE)
  expect: [allow, allow, deny]
- name: dev system
