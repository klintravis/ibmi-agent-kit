# Policy tests for single-partition-ladder.yaml: every role in every environment, a read and a write, plus an
# unclassified command (denied as danger) wherever the write is allowed.
# Run: ibmi-agent-kit policy test single-partition-ladder.yaml single-partition-ladder.tests.yaml
# `expect` is the policy's decision per statement; in observe mode a deny is logged and still run.
# Users: JDOE (dev), MROE (qa), ANL01 (analyst). A personal library is the user's own name.
- name: dev scratch
  as: { user: JDOE, groups: [GRPDEV] }
  script: |
    SELECT * FROM QTEMP.T;
    DELETE FROM QTEMP.T;
    CL: ZZZUNKNOWN LIB(QTEMP)
  expect: [allow, allow, deny]
- name: dev personal
  as: { user: JDOE, groups: [GRPDEV] }
  script: |
    SELECT * FROM JDOE.T;
    DELETE FROM JDOE.T;
    CL: ZZZUNKNOWN LIB(JDOE)
  expect: [allow, allow, deny]
- name: dev system
  as: { user: JDOE, groups: [GRPDEV] }
  script: |
    SELECT * FROM QSYS2.T;
    DELETE FROM QSYS2.T
  expect: [allow, deny]
- name: dev dev
  as: { user: JDOE, groups: [GRPDEV] }
  script: |
    SELECT * FROM DVORD.T;
    DELETE FROM DVORD.T;
    CL: ZZZUNKNOWN LIB(DVORD)
  expect: [allow, allow, deny]
- name: dev test
  as: { user: JDOE, groups: [GRPDEV] }
  script: |
