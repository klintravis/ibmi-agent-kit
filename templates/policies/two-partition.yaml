# Template: two partitions, development and production, each with its own system and RDB.
# Copy to your company repo as policy.yaml and replace every invented name.
# Observe mode everywhere: denies are logged and the statement still runs, except danger, unqualified changes and partition conflicts, which are always denied.
version: 1
mode: observe

partitions:
  - { name: dev,  systems: [DEVBOX],  rdbs: [DEVRDB] }
  - { name: prod, systems: [PRODBOX], rdbs: [PRODRDB] }
unknown_partition: prod        # a system that matches neither is treated as prod

environments:
  - { name: scratch,  libraries: [QTEMP] }
  - { name: personal, match: ["${USER}", "${USER}_*"], partitions: [dev] }
  - { name: system,   match: ["Q*", "SYS*"] }
  - { name: dev,      match: ["DV*"], partitions: [dev] }
  - { name: test,     match: ["TS*"], partitions: [dev] }  # test libraries live on the dev partition
  - { name: live,     match: ["LV*"], partitions: [prod] }

roles:
  - { name: qa,  groups: [GRPQA] }
  - { name: dev, groups: [GRPDEV] }
  - { name: analyst, groups: [GRPANL] }
default_role: analyst

rules:
  - { classes: [danger], decision: deny }   # documents the built-in; never reached
  - { env: scratch, classes: [read, write, ddl], decision: allow }
  - { roles: [dev, qa], partition: dev, env: [personal, dev], decision: allow }
  - { roles: [qa], partition: dev, env: test, decision: allow }
  - { classes: [read], decision: allow }
