# Generated by the ibmi-kit-config bootstrap from discovery.json (dry-run; every name is invented).
# Copied from templates/policies/three-lpar.yaml and filled. Evidence per section is in the comments.
# Observe mode everywhere: denies are logged and the statement still runs, except danger, unqualified changes and partition conflicts, which are always denied.
version: 1
mode: observe

partitions:                                                  # S1 RDB, S3 HOST_NAME, S5 IASP RDB
  - { name: dev,  systems: [KDEV01], rdbs: [KDEV01] }
  - { name: qa,   systems: [KQA01],  rdbs: [KQA01, KQAIASP] }
  - { name: prod, systems: [KPRD01], rdbs: [KPRD01] }
unknown_partition: prod                                      # Q3
command_files: [commands.yaml]                               # C2-C4, Q14: Example CM in XCMLIB

environments:                                                # L1 prefixes, Q4 order; first match wins
  - { name: scratch,  libraries: [QTEMP] }
  - { name: personal, match: ["${USER}"], partitions: [dev] }  # I1: 6 of 6 GRPDEV users have curlib = own name
  - { name: system,   match: ["Q*", "SYS*"] }
  - { name: dev,      match: ["WD*"], partitions: [dev] }      # 3 libraries
  - { name: integ,    match: ["WI*"], partitions: [dev] }      # 3 libraries, owned by XCMOWN
  - { name: test,     match: ["WQ*"], partitions: [qa] }       # 3 libraries
  - { name: live,     match: ["WP*"], partitions: [prod] }     # 3 libraries

roles:                                                       # I1, I2, A1, Q8
  - { name: dev,     groups: [GRPDEV] }                      # *ALL on WD*, *CHANGE on WI*
  - { name: qa,      groups: [GRPQA] }                       # *CHANGE on WQ*
  - { name: analyst, groups: [GRPRPT] }                      # no change authority found
default_role: analyst                                        # Q11

rules:                                                       # Q12, Q15
  - { classes: [danger], decision: deny }   # documents the built-in; never reached
  - { env: scratch, classes: [read, write, ddl], decision: allow }
  - { roles: [dev], partition: dev, env: [personal, dev, integ], decision: allow }
  - { roles: [qa], partition: qa, env: test, decision: allow }
  - { roles: [dev], partition: dev, classes: [promote_int], decision: allow }
  - { roles: [qa], partition: dev, classes: [promote_qa], decision: allow }
  - { classes: [read], decision: allow }
