# Generated by the ibmi-kit-config bootstrap (dry-run): the invented Example CM product found in
# XCMLIB (C2, C3). XCPROM promotes a request to a level; each level is its own class (Q14).
commands:
  XCPROM:
    class_by_param: { param: TOLVL, values: { INT: promote_int, QA: promote_qa, PROD: promote_prod }, default: danger }
    library: XCMLIB
    positional: [REQ, TOLVL]
  XCSTAT:
    class: read
    library: XCMLIB
