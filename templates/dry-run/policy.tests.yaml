# Generated by the ibmi-kit-config bootstrap (dry-run) for policy.yaml: every role in every
# environment, a read and a write (one allow and one deny each), an unclassified command wherever
# the write is allowed, and the Example CM promote command per level.
# Run: ibmi-agent-kit policy test policy.yaml policy.tests.yaml
# `expect` is the policy's decision; in observe mode a deny is logged and still runs, except danger, unqualified changes and partition conflicts, which are always denied.
# Test users are invented, one per role: DEV01 (dev), QA01 (qa), RPT01 (analyst).
- name: dev scratch
  as: { user: DEV01, groups: [GRPDEV], partition: dev }
  script: |
    SELECT * FROM QTEMP.T;
    DELETE FROM QTEMP.T;
    CL: ZZZUNKNOWN LIB(QTEMP)
  expect: [allow, allow, deny]
- name: dev personal
  as: { user: DEV01, groups: [GRPDEV], partition: dev }
  script: |
    SELECT * FROM DEV01.T;
    DELETE FROM DEV01.T;
    CL: ZZZUNKNOWN LIB(DEV01)
  expect: [allow, allow, deny]
- name: dev system
