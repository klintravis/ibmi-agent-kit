- name: dev promotes to INT, not to QA
  as: { user: DEV01, groups: [GRPDEV], partition: dev }
  script: |
    CL: XCMLIB/XCPROM REQ(1001) TOLVL(INT)
    CL: XCMLIB/XCPROM 1001 QA
  expect: [allow, deny]
- name: qa promotes to QA, not to PROD
  as: { user: QA01, groups: [GRPQA], partition: dev }
  script: |
    CL: XCMLIB/XCPROM REQ(1001) TOLVL(QA)
    CL: XCMLIB/XCPROM REQ(1001) TOLVL(PROD)
  expect: [allow, deny]
- name: analyst promotes nowhere, reads status
  as: { user: RPT01, groups: [GRPRPT], partition: dev }
  script: |
    CL: XCMLIB/XCPROM REQ(1001) TOLVL(INT)
    CL: XCMLIB/XCSTAT REQ(1001)
  expect: [deny, allow]
- name: everyone may run the smoke verb
  as: { user: RPT01, groups: [GRPRPT], partition: prod }
  verb: org:SMOKE
  expect: allow
- name: the promote command outside its product library is danger
  as: { user: DEV01, groups: [GRPDEV], partition: dev }
  script: |
    CL: OTHERLIB/XCPROM REQ(1001) TOLVL(INT)
  expect: deny
