# Expected decisions for part E of the demo (observe). MYLIB and MYUSER are placeholders; keep them
# in step with policy-observe.yaml and verbs/SEED-*.yaml.
- name: SEED-PREP runs in the own library
  as: { user: MYUSER, groups: [], partition: demo }
  verb: SEED-PREP
  args: { lib: MYLIB }
  expect: allow
- name: SEED-BUILD runs in the own library
  as: { user: MYUSER, groups: [], partition: demo }
  verb: SEED-BUILD
  args: { lib: MYLIB }
  expect: allow
- name: SEED-ADDROW runs in the own library
  as: { user: MYUSER, groups: [], partition: demo }
  verb: SEED-ADDROW
  args: { lib: MYLIB }
  expect: allow
- name: SEED-CLEAN runs in the own library
  as: { user: MYUSER, groups: [], partition: demo }
  verb: SEED-CLEAN
  args: { lib: MYLIB }
  expect: allow
- name: the 5250 session calls the list program
  as: { user: MYUSER, groups: [], partition: demo }
  script: "CL: CALL PGM(MYLIB/SEEDLST)"
  expect: allow
