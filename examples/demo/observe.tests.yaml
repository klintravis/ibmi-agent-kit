# Expected decisions for the demo (observe). MYLIB and MYUSER are placeholders; keep them in step
# with policy-observe.yaml.
- name: owner works in the own library
  as: { user: MYUSER, groups: [], partition: demo }
  script: |
    SELECT * FROM MYLIB.T;
    CREATE TABLE MYLIB.T (X INT);
    INSERT INTO MYLIB.T VALUES (1);
    DROP TABLE MYLIB.T
  expect: [allow, allow, allow, allow]
- name: unqualified change and danger are denied
  as: { user: MYUSER, groups: [], partition: demo }
  script: |
    CL: DLTF FILE(X)
    CL: PWRDWNSYS
  expect: [deny, deny]
- name: another user only reads the owner's library
  as: { user: OTHER, groups: [], partition: demo }
  script: SELECT * FROM MYLIB.T; DELETE FROM MYLIB.T
  expect: [allow, deny]
- name: owner builds an ILE app in the own library
  as: { user: MYUSER, groups: [], partition: demo }
  script: |
    CL: CRTPF FILE(MYLIB/DEMOCUST) SRCFILE(MYLIB/QDDSSRC)
    INSERT INTO MYLIB.DEMOCUST VALUES (1001, 'Demo Customer', 'Berlin', 1250.00);
    CL: CRTBNDDIR BNDDIR(MYLIB/CUSTBD)
    CL: ADDBNDDIRE BNDDIR(MYLIB/CUSTBD) OBJ((MYLIB/CUSTSRV *SRVPGM))
    CL: CRTRPGMOD MODULE(MYLIB/CUSTLST) SRCFILE(MYLIB/QRPGLESRC) SRCMBR(CUSTLST)
    CL: CRTSRVPGM SRVPGM(MYLIB/CUSTSRV) MODULE(MYLIB/CUSTSRV) EXPORT(*ALL)
    CL: CRTPGM PGM(MYLIB/CUSTLST) MODULE(MYLIB/CUSTLST) BNDSRVPGM((MYLIB/CUSTSRV))
  expect: [allow, allow, allow, allow, allow, allow, allow]
- name: a build in an unnamed or a system library is denied by the policy
  as: { user: MYUSER, groups: [], partition: demo }
  script: |
    CL: DLTBNDDIR BNDDIR(CUSTBD)
    CL: PWRDWNSYS
    CL: CRTPF FILE(QGPL/X) SRCFILE(MYLIB/QDDSSRC)
  expect: [deny, deny, deny]
