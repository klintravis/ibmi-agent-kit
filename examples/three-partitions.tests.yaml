# Policy tests for three-partitions.yaml: every role in every environment, each allowed and denied
# case the policy has. Run: ibmi-agent-kit policy test three-partitions.yaml three-partitions.tests.yaml
# `expect` is one decision per statement (or one for the whole script). It is the policy's decision:
# on an observe-mode partition a deny is logged and run, and is still tested here as deny.
# Users: JDOE (dev or qa by group), CTR01 (contractor by name), ANL01 (analyst). A personal
# library is the user's own name.

# --- analyst: reads anywhere but the blocked library; writes only in QTEMP ---
- name: analyst scratch
  as: { user: ANL01, groups: [GRPANL], partition: dev }
  script: |
    SELECT * FROM QTEMP.T;
    DELETE FROM QTEMP.T;
    CL: CRTBNDRPG PGM(QTEMP/P)
  expect: [allow, allow, deny]
- name: analyst personal
  as: { user: ANL01, groups: [GRPANL], partition: dev }
  script: SELECT * FROM ANL01.T; DELETE FROM ANL01.T
  expect: [allow, deny]
- name: analyst blocked
  as: { user: ANL01, groups: [GRPANL], partition: dev }
  script: SELECT * FROM PAYLIB.T
  expect: deny
- name: analyst test
  as: { user: ANL01, groups: [GRPANL], partition: qa }
  script: SELECT * FROM QTORD.T; DELETE FROM QTORD.T
  expect: [allow, deny]
- name: analyst system
  as: { user: ANL01, groups: [GRPANL], partition: dev }
  script: SELECT * FROM QSYS2.SYSTABLES; DELETE FROM QSYS2.X
  expect: [allow, deny]
- name: analyst devlibs
  as: { user: ANL01, groups: [GRPANL], partition: dev }
  script: SELECT * FROM DVORD.T; DELETE FROM DVORD.T
  expect: [allow, deny]
- name: analyst integ
  as: { user: ANL01, groups: [GRPANL], partition: dev }
  script: SELECT * FROM INORD.T; DELETE FROM INORD.T
  expect: [allow, deny]
- name: analyst stage_qa
  as: { user: ANL01, groups: [GRPANL], partition: dev }
  script: SELECT * FROM SQORD.T; DELETE FROM SQORD.T
  expect: [allow, deny]
- name: analyst stage_prod
  as: { user: ANL01, groups: [GRPANL], partition: dev }
  script: SELECT * FROM SPORD.T; DELETE FROM SPORD.T
  expect: [allow, deny]
- name: analyst live
  as: { user: ANL01, groups: [GRPANL], partition: prod }
  script: SELECT * FROM LVORD.T; DELETE FROM LVORD.T
  expect: [allow, deny]

