# --- dev: everything in personal, devlibs and integ on dev; reads elsewhere ---
- name: dev scratch
  as: { user: JDOE, groups: [GRPDEV], partition: dev }
  script: |
    DELETE FROM QTEMP.T;
    CL: CRTBNDRPG PGM(QTEMP/P)
  expect: [allow, deny]
- name: dev personal
  as: { user: JDOE, groups: [GRPDEV], partition: dev }
  script: |
    DELETE FROM JDOE.T;
    CL: CRTBNDRPG PGM(JDOE/P)
  expect: [allow, allow]
- name: dev blocked
  as: { user: JDOE, groups: [GRPDEV], partition: dev }
  script: SELECT * FROM PAYLIB.T
  expect: deny
- name: dev test
  as: { user: JDOE, groups: [GRPDEV], partition: qa }
